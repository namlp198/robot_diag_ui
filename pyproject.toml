[project]
name = "robot-diag"
version = "0.2.0"
description = "robot_diag: SWD/VCP diagnostic daemon, CLI and UI for robot_att / robot_rc_rtos"
requires-python = ">=3.12"
dependencies = ["pyelftools>=0.31", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]
daemon = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
chat = ["claude-agent-sdk==0.2.180"]
probe = ["pyocd==0.46.1", "pyserial>=3.5"]
app = ["pywebview==6.2.1"]

[project.scripts]
rdt = "rdt.cli:main"

[tool.setuptools]
packages = ["rdt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
