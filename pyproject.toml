[project]
name = "robot-diag"
version = "0.1.0"
description = "robot_diag: SWD/VCP diagnostic daemon, CLI and UI for robot_att / robot_rc_rtos"
requires-python = ">=3.12"
dependencies = ["pyelftools>=0.31", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rdt = "rdt.cli:main"

[tool.setuptools]
packages = ["rdt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
